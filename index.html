<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Portfolio</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, 'Segoe UI', Roboto, sans-serif; background: #0b1120; color: #e6ebf5; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .card { max-width: 560px; width: 100%; text-align: center; background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.1); border-radius: 24px; padding: 56px 40px; }
  .avatar { width: 96px; height: 96px; border-radius: 50%; background: linear-gradient(135deg, #7c6cf0, #22d3ee); display: grid; place-items: center; font-size: 40px; font-weight: 800; margin: 0 auto 20px; }
  h1 { font-size: 32px; margin-bottom: 8px; }
  p.role { color: #22d3ee; font-weight: 600; margin-bottom: 16px; }
  p.bio { color: #9aa7bd; line-height: 1.7; margin-bottom: 28px; }
  .links { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  a.btn { padding: 12px 28px; border-radius: 12px; text-decoration: none; font-weight: 700; background: linear-gradient(135deg, #7c6cf0, #22d3ee); color: #fff; }
  a.ghost { padding: 12px 28px; border-radius: 12px; text-decoration: none; font-weight: 700; border: 1px solid rgba(255,255,255,.2); color: #e6ebf5; }
</style>
</head>
<body>
  <div class="card">
    <div class="avatar">Y</div>
    <h1>Your Name</h1>
    <p class="role">Web Developer &amp; Designer</p>
    <p class="bio">Edit this page from your SubManga hosting panel. Replace this text with your story, add your projects, and share your link with the world.</p>
    <div class="links">
      <a class="btn" href="#">My Work</a>
      <a class="ghost" href="#">Contact</a>
    </div>
  </div>
<!-- Code injected by live-server -->

</body>
</html>
